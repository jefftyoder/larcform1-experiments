# Larcform1 minimal coupled config - tests initial conditions and coupling
# 
# Neglects:
# - EDMFX
# - Microphysics
#

# --- Coupler/domain setup ---
domain_type: "column"
column_latlon: [80.0, 0.0]       # Pithan 2016: 80°N
scm_surface_type: "sea_ice"
mode_name: "amip"                 # enforces prescribed ocean + prescribed ice
land_model: "nothing"

# --- Time ---
start_date: "20010101"            # polar winter; HadISST at 80°N Jan = full ice cover
t_end: "10days"                   # half of Pithan 2016 run length
dt: "30secs"
dt_cpl: "30secs"
dt_rad: "60secs"
checkpoint_dt: "90days"

# --- Atmosphere ---
initial_condition: "Larcform1"
surface_setup: "DefaultMoninObukhov"
disable_surface_flux_tendency: "false"
vert_diff: "false"  # for minimal config
rayleigh_sponge: "true"
microphysics_model: "1M"          # for minimal config
cloud_model: "grid_scale"
rad: "allskywithclear"
insolation: "larcform1"           # zero TOA flux (polar winter)

# Numerics
z_max: 9000.0
z_elem: 60
z_stretch: true
dz_bottom: 20.0
ode_algo: "ARS343"
approximate_linear_solve_iters: 2
implicit_microphysics: false       # 1M microphysics in implicit eq. causes Newton overshoot → log(p<0)

# --- Conservation / checks ---
energy_check: false
conservation_softfail: false
rmse_check: false
perf_summary: true

# --- Output ---
log_to_file: true
netcdf_output_at_levels: true
output_default_diagnostics: false
coupler_output_dir: "output"

# Diagnostics — match Larcform1Plots in ClimaAtmos.jl/.buildkite/ci_plots.jl
diagnostics:
  - short_name: [ta, thetaa, pfull, cl, clw, cli, hus, hur, ua, va, wa, rlu, rld, rhoa]
    period: 1hours
    reduction_time: average
  - short_name: [rlut, rlus, rlds, lwp, clivi, pr, prsn, hfss, hfls, ts, evspsbl, rsdt, rlutcs, rldscs]
    period: 1hours
    reduction_time: average
