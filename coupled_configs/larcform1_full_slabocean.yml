# Larcform1 minimal coupled config - tests initial conditions and coupling
# 

# --- Coupler/domain setup ---
domain_type: "column"
column_latlon: [80.0, 0.0]        # Pithan 2016: 80°N
scm_surface_type: "ocean"         # }
mode_name: "slabplanet_aqua"      # } These three used to invoke SCM slab ocean
ocean_model: "slab"               # } 
land_model: "nothing"

# --- Time ---
start_date: "20010101"            # polar winter; HadISST at 80°N Jan = full ice cover
t_end: "20days"                    # half of Pithan 2016 run length
dt: "60secs"
dt_cpl: "60secs"
dt_rad: "60secs"
checkpoint_dt: "90days"

# --- Atmosphere ---
initial_condition: "Larcform1"
surface_setup: "PrescribedSurface"    # usind DefaultMoninObhukov recomputes fluxes. Need PrescribedSurface to let coupler own fluxes         
disable_surface_flux_tendency: false
vert_diff: "false"                     # Shouldn't be needed with EDMFx / edonly enabled
turbconv: prognostic_edmfx
#edmfx_vertical_diffusion: true
rayleigh_sponge: true
microphysics_model: "1M"              
cloud_model: "quadrature" #"grid_scale"
rad: "allskywithclear"
insolation: "larcform1"                # sets zero TOA flux (polar winter)

# Numerics
z_max: 9000.0
z_elem: 90
z_stretch: true
dz_bottom: 20.0
ode_algo: "ARS343"
approximate_linear_solve_iters: 2
implicit_microphysics: false       # 1M microphysics in implicit eq. causes Newton overshoot → log(p<0)

# --- Conservation / checks ---
energy_check: false
conservation_softfail: false
rmse_check: false
perf_summary: true

# --- Output ---
log_to_file: false
netcdf_output_at_levels: true
output_default_diagnostics: false
coupler_output_dir: "output"

# Diagnostics — match Larcform1Plots in ClimaAtmos.jl/.buildkite/ci_plots.jl
diagnostics:
  - short_name: [ta, thetaa, pfull, cl, clw, cli, hus, hur, ua, va, wa, rlu, rld, rhoa]
    period: 1hours
    reduction_time: average
  - short_name: [rlut, rlus, rlds, lwp, clivi, pr, prsn, hfss, hfls, ts, evspsbl, rsdt, rlutcs, rldscs]
    period: 1hours
    reduction_time: average
