# Larcform1 coupled sea-ice run with ed_only edmfx.
# Surface: PrescribedIceSimulation (1D energy balance, AMIP mode).
# Turbulence: edonly_edmfx (diffusion only, no mass flux).

# job setup
job_id: lf1_seaice_cpl_edonly
FLOAT_TYPE: "Float32"

# --- Coupler-specific wiring ---
domain_type: "column"
column_latlon: [80.0, 0.0]            # Pithan 2016: 80°N
scm_surface_type: "sea_ice"           # PrescribedIceSimulation (1D energy balance)
mode_name: "amip"                     # AMIP: prescribed ocean + prescribed (thermodynamic) ice
surface_setup: "PrescribedSurface"  # coupler computes turbulent fluxes via MO
dt_cpl: "30secs"
coupler_output_dir: "output"

# --- Atmosphere ---
initial_condition: "Larcform1"
rayleigh_sponge: true
disable_surface_flux_tendency: false

# Temporal
start_date: "20010101"                # polar winter; full ice cover at 80°N
t_end: "20days"
dt: "30secs"
dt_rad: "30secs"
checkpoint_dt: "90days"

# Spatial
z_max: 9000.0
z_elem: 90
z_stretch: true
dz_bottom: 20.0
x_elem: 1
y_elem: 1
h_elem: 6

# Solver
approximate_linear_solve_iters: 2
ode_algo: "ARS343"                   # ARS343 stable for edonly (no prognostic updrafts)
implicit_microphysics: true

# Parameters
coupler_toml: [ClimaAtmos.jl/toml/larcform1_1M_edonly_edmfx.toml]

# Radiation
rad: "allskywithclear"
insolation: "larcform1"               # zero TOA flux (polar winter)

# Turbulence and EDMFx
turbconv: edonly_edmfx
implicit_diffusion: true
hyperdiff: ~
edmfx_entr_model: "Generalized"
edmfx_sgs_diffusive_flux: true
edmfx_vertical_diffusion: true

# Clouds — quadrature SGS clouds, 1M microphysics
cloud_model: quadrature
microphysics_model: "1M"

# --- Conservation / checks ---
energy_check: false
conservation_softfail: false
rmse_check: false
perf_summary: true

# --- Output ---
log_to_file: true
log_progress: true
output_dir_style: "ActiveLink"
check_conservation: false
netcdf_output_at_levels: true
output_default_diagnostics: false


# Diagnostics
diagnostics:
  - short_name: [ta, thetaa, pfull, rhoa, hus, hur, ts, tas]
    period: 1hours
    reduction_time: average
  - short_name: [ua, va, wa]
    period: 1hours
    reduction_time: average
  - short_name: [cl, clw, cli, lwp, clivi]
    period: 1hours
    reduction_time: average
  - short_name: [rlu, rld, rlut, rlus, rlds, rsdt, rlutcs, rldscs]
    period: 1hours
    reduction_time: average
  - short_name: [pr, prsn, evspsbl, husra, hussn]
    period: 1hours
    reduction_time: average
  - short_name: [hfss, hfls]
    period: 1hours
    reduction_time: average
