# Larcform1 coupled slab-ocean run, paired with
# ClimaAtmos.jl/config/model_configs/larcform1_slabocean_standalone.yml.

# job setup
job_id: lf1_slab_cpl_progedmfx
FLOAT_TYPE: "Float32"     # this doesn't seem to do anything. Does the Coupler use a different yml field than Atmos?

# --- Coupler-specific wiring ---
domain_type: "column"
column_latlon: [80.0, 0.0]            # Pithan 2016: 80°N
scm_surface_type: "ocean"             # }
mode_name: "slabplanet_aqua"          # } invoke SCM slab ocean
ocean_model: "slab"                   # }
land_model: "nothing"
surface_setup: "PrescribedSurface"    # DefaultMoninObukhov would recompute fluxes; PrescribedSurface lets the coupler own them
dt_cpl: "1hours"
coupler_output_dir: "output"

# --- Atmosphere (must match standalone) ---
initial_condition: "Larcform1"
rayleigh_sponge: true
disable_surface_flux_tendency: false

# Temporal
start_date: "20010101"                # polar winter; HadISST at 80°N Jan = full ice cover
t_end: "6days"                        # partial run for testing
dt: "30secs"
dt_rad: "1hours"
checkpoint_dt: "90days"

# Spatial
z_max: 9000.0
z_elem: 30                            # I dropped this down for testing. Bump back up later.
z_stretch: true
dz_bottom: 20.0
x_elem: 1
y_elem: 1
h_elem: 6                             # This is for the cubed sphere and shouldn't impact SCM

# Solver
approximate_linear_solve_iters: 2
ode_algo: "ARS222"                   # ARS222 is needed for prognostic EDMFx stability. ARS343 crash is known issue.
implicit_microphysics: false

# Parameters
coupler_toml: [ClimaAtmos.jl/toml/prognostic_edmfx.toml, ClimaAtmos.jl/toml/larcform1_1M_prognostic_edmfx.toml]

# Radiation
rad: "allskywithclear"
insolation: "larcform1"               # zero TOA flux (polar winter)

# Turbulence and EDMFx
turbconv: prognostic_edmfx
prognostic_tke: true                # enabled for prognostic_edmfx testing
implicit_diffusion: true            # enabled for prognostic_edmfx testing 
implicit_sgs_advection: true        # enabled for prognostic_edmfx testing 
implicit_sgs_entr_detr: true
implicit_sgs_nh_pressure: true
implicit_sgs_vertdiff: true
implicit_sgs_mass_flux: true
hyperdiff: ~
edmfx_entr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true

# Clouds — quadrature SGS clouds, 1M microphysics
cloud_model: quadrature
microphysics_model: "1M"

# --- Conservation / checks ---
energy_check: false
conservation_softfail: false
rmse_check: false
perf_summary: true

# --- Output ---
log_to_file: true
log_progress: true
output_dir_style: "ActiveLink"
check_conservation: false
netcdf_output_at_levels: true
output_default_diagnostics: false


# Diagnostics — match standalone
diagnostics:
  - short_name: [ta, thetaa, pfull, rhoa, hus, hur, ts, tas]
    period: 1hours
    reduction_time: average
  - short_name: [ua, va, wa]
    period: 1hours
    reduction_time: average
  - short_name: [cl, clw, cli, lwp, clivi]
    period: 1hours
    reduction_time: average
  - short_name: [rlu, rld, rlut, rlus, rlds, rsdt, rlutcs, rldscs]
    period: 1hours
    reduction_time: average
  - short_name: [pr, prsn, evspsbl, husra, hussn]
    period: 1hours
    reduction_time: average
  - short_name: [hfss, hfls]
    period: 1hours
    reduction_time: average
  - short_name: [tke, lmix, bgrad, strain, edt, evu]
    period: 10mins
    reduction_time: average
