# lf1e clw calibration — forward model config
#
# Standalone (NOT an overlay): ClimaCalibrate's forward_model loads exactly this
# file. Contents = larcform1_1M_prognostic_edmfx base + the validated s11 grid
# ("experiments/scm speed tests/" — z_max 5 km, 100 stretched levels, dt_rad
# 30 min, TemperatureDependent ice formation; 42 s solve, converged science).
#
# The `toml:` entry is replaced at runtime by model_interface.jl with the
# absolute path to configs/toml/larcform1_calibration_base.toml plus the
# per-member sampled-parameter toml. output_dir is set per member.

job_id: lf1e_clw_cal_member
reference_job_id: larcform1

# Atmosphere / surface
initial_condition: Larcform1
rayleigh_sponge: false
prognostic_surface: SlabOceanSST
surface_setup: DefaultMoninObukhov
disable_surface_flux_tendency: false

# Temporal
FLOAT_TYPE: Float32
t_end: 2days
dt: 30secs
dt_rad: 30mins

# Spatial (validated s11 grid)
config: "column"
z_max: 5000.0
z_elem: 100
z_stretch: true
dz_bottom: 10.0

# Solver
approximate_linear_solve_iters: 2
ode_algo: ARS222

# Parameters (replaced with absolute paths at runtime; see header)
toml: [configs/toml/larcform1_calibration_base.toml]

# Radiation
rad: allskywithclear
insolation: larcform1

# Turbulence and EDMF
turbconv: prognostic_edmfx
implicit_diffusion: true
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
hyperdiff: ~

# Clouds / microphysics
cloud_model: quadrature
microphysics_model: 1M
cloud_ice_formation: "TemperatureDependent"

# Logging and diagnostics
log_to_file: true
check_conservation: false
netcdf_output_at_levels: true
output_default_diagnostics: false

# Just what the observation map needs (clw, cli, pfull) plus cheap sanity vars.
diagnostics:
  - short_name: [ta, pfull, hus, clw, cli, lwp, clivi]
    period: 1hours
    reduction_time: average
