# scm speed test #1 — s11: calibration-candidate validation (s10 grid + dt_rad 30mins)
#
# s10 (converged: 100 stretched levels, 10 m bottom, 5 km top) ran with dt_rad
# 5mins; the base config moved to 30mins (validated only on the 100 m uniform
# grid, s2/s5). This is the one-factor completion on the converged grid: with
# 10 m cloud-top layers, 30-min-stale heating profiles could misplace cloud-top
# cooling — or the robust converged cloud may not care. dt_rad pinned explicitly
# (base default changed 2026-07-04; don't rely on inheritance for this test).
# Acceptance vs s10: onset h0, 48/48 hrs, max clw within ~10% of 3.97e-4,
# clwvi mean ≈0.138, rlds within ~1 W/m², h24 cloud base/top within ~2 hPa.
# Physics: v10 TemperatureDependent cloud-ice formation.
job_id: lf1e_speed1_s11_stretch100_rad30
output_dir: "experiments/scm speed tests/output/lf1e-speed-1/s11_stretch100_rad30"
cloud_ice_formation: "TemperatureDependent"
z_max: 5000.0
z_elem: 100
z_stretch: true
dt_rad: "30mins"

# Minimal diagnostics (shared across all speed-test runs).
diagnostics:
  - short_name: [ta, pfull, rhoa, hus, hur, ua, va, cl, clw, cli, lwp, clivi]
    period: 1hours
    reduction_time: average
  - short_name: [ts, rlds, rlus, rlut, pr, prsn, hfss, hfls]
    period: 1hours
    reduction_time: average
