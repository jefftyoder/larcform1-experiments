# scm speed test #1 — s2: long radiation timestep only
#
# dt_rad 5mins→30mins (6× fewer RRTMGP calls; EC-Earth itself runs radiation
# hourly). Risk: staler cloud-top LW cooling coupling for the thin mixed-phase
# layer. Grid unchanged (9 km, 90 levels, dz 100 m).
# Physics: v10 TemperatureDependent cloud-ice formation.
job_id: lf1e_speed1_s2_dtrad30min
output_dir: "experiments/scm speed tests/output/lf1e-speed-1/s2_dtrad30min"
cloud_ice_formation: "TemperatureDependent"
dt_rad: "30mins"

# Minimal diagnostics: exactly the variables convert_to_pithan.py consumes
# (profiles + rhoa for derived prw; surface fluxes/radiation/precip). Replaces
# the base list wholesale — drops the 10-min EDMF/microphysics-tendency groups.
diagnostics:
  - short_name: [ta, pfull, rhoa, hus, hur, ua, va, cl, clw, cli, lwp, clivi]
    period: 1hours
    reduction_time: average
  - short_name: [ts, rlds, rlus, rlut, pr, prsn, hfss, hfls]
    period: 1hours
    reduction_time: average
