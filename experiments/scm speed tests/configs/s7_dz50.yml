# scm speed test #1 — s7: uniform-grid convergence, dz = 50 m
#
# First rung of the uniform-grid convergence ladder (s7/s8/s9 = 50/25/10 m over
# 5 km). Question: does refining the UNIFORM grid move the answer toward s4's
# stretched-grid cloud (early onset, 48/48 persistence, cloud-top liquid max)?
# If yes → 100 m was under-resolved and s4 is the more faithful answer.
# If no → the stretch itself distorts (the base config's z-banding warning).
# dt_rad stays at the base 5 min for comparability with s3/s4.
# Physics: v10 TemperatureDependent cloud-ice formation.
job_id: lf1e_speed1_s7_dz50
output_dir: "experiments/scm speed tests/output/lf1e-speed-1/s7_dz50"
cloud_ice_formation: "TemperatureDependent"
z_max: 5000.0
z_elem: 100

# Minimal diagnostics (shared across all speed-test runs).
diagnostics:
  - short_name: [ta, pfull, rhoa, hus, hur, ua, va, cl, clw, cli, lwp, clivi]
    period: 1hours
    reduction_time: average
  - short_name: [ts, rlds, rlus, rlut, pr, prsn, hfss, hfls]
    period: 1hours
    reduction_time: average
