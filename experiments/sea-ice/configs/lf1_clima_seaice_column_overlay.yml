# Phase 2 coupler overlay for the Larcform1 SCM over ClimaSeaIce ice + snow
# (custom `clima_seaice_column` component,
# experiments/sea-ice/components/clima_seaice_column.jl).
#
# This file contains ONLY coupler-specific keys plus atmos keys that must differ
# from the standalone run. It is merged on top of
# ClimaAtmos.jl/config/model_configs/larcform1_1M_prognostic_edmfx.yml
# by run_clima_seaice_column.jl (overlay wins), which also validates every key
# against the coupler + atmos defaults so nothing is silently ignored.
#
# Ice physics (see ClimaSeaIceColumnSimulation for TOML overrides via
# coupler_toml, prefix `seaice_column_`): 1 m ice + 0.1 m w.e. snow (snow
# on/off via `seaice_column_enable_snow`), z0m = z0b = 1e-3 m, ocean at
# 271.35 K, initial T_sfc = 250 K, prognostic thickness/concentration.

job_id: "lf1_clima_seaice_column"

# --- Coupler wiring ---
domain_type: "column"
column_latlon: [80.0, 0.0]        # Pithan 2016: 80°N
scm_surface_type: "sea_ice"       # column mode: nulls ocean+land, forces ice fraction = 1
mode_name: "amip"                 # mode dict entry; ice_model passes through in column mode
ice_model: "clima_seaice_column"  # custom component; driver must include it before construction
dt_cpl: "30secs"                  # = atmos dt; every component steps at 30 s
coupler_output_dir: "output/lf1_clima_seaice_column"

# --- Calibrated microphysics (lf1e-clw-calibration-1, uki_1 final means) ---
# v10 physics (temperature-dependent ice nucleation) + calibrated parameters.
# Requires the vendored CloudMicrophysics.jl (Frostenberg a/b wired) dev'd in
# the root env. The base toml here is the stock larcform1 toml minus the two
# relaxation timescales (duplicate-entry workaround); the calibrated toml
# supplies them. Paths resolve from the repo root (the driver's cwd).
# NOTE: must be `coupler_toml`, not atmos `toml` — ClimaCoupler v0.2.2 silently
# reverts atmos-toml values to ClimaParams defaults (ClimaCouplerClimaAtmosExt.jl:668).
cloud_ice_formation: "TemperatureDependent"
coupler_toml:
  - "experiments/clw calibration/configs/toml/larcform1_calibration_base.toml"
  - "experiments/clw calibration/configs/toml/calibrated_uki1_final.toml"

# --- Atmos keys that must differ from the standalone config ---
# Coupler owns surface fluxes; atmos must not evolve its own slab surface.
# PrescribedSST + Larcform1 setup → initial T_sfc = 250 K (Pithan), matching the
# ice component's own initial_surface_temperature; the coupler overwrites T_sfc
# every step.
surface_setup: "PrescribedSurface"
prognostic_surface: "PrescribedSST"
t_end: "2days"
start_date: "20010101"            # polar winter
checkpoint_dt: "90days"           # > t_end: no checkpoints during smoke test
