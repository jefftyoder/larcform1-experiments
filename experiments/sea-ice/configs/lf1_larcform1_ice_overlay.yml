# Phase 1 coupler overlay for the Larcform1 SCM over Pithan-correct slab sea ice
# (custom `larcform1_ice` component, experiments/sea-ice/components/larcform1_ice.jl).
#
# This file contains ONLY coupler-specific keys plus atmos keys that must differ
# from the standalone run. It is merged on top of
# ClimaAtmos.jl/config/model_configs/larcform1_1M_prognostic_edmfx.yml
# by run_larcform1_ice.jl (overlay wins), which also validates every key
# against the coupler + atmos defaults so nothing is silently ignored.
#
# Ice physics (see Larcform1IceParameters for TOML overrides via coupler_toml):
#   h = 1 m, z0m = z0b = 1e-3 m, T_base = T_freeze = 271.35 K, initial T_sfc = 250 K.

job_id: "lf1_larcform1_ice"

# --- Coupler wiring ---
domain_type: "column"
column_latlon: [80.0, 0.0]        # Pithan 2016: 80°N
scm_surface_type: "sea_ice"       # column mode: nulls ocean+land, forces ice fraction = 1
mode_name: "amip"                 # mode dict entry; ice_model passes through in column mode
ice_model: "larcform1_ice"        # custom component; driver must include it before construction
dt_cpl: "30secs"                  # = atmos dt; every component steps at 30 s
coupler_output_dir: "output/lf1_larcform1_ice"

# --- Atmos keys that must differ from the standalone config ---
# Coupler owns surface fluxes; atmos must not evolve its own slab surface.
# PrescribedSurface → flux_scheme = nothing (coupler handoff; requires the
# local ClimaAtmos fix making PrescribedSurface override setup flux pieces).
# PrescribedSST + Larcform1 setup → initial T_sfc = 250 K (Pithan), matching the
# ice component's own T_sfc_init; the coupler overwrites T_sfc every step.
surface_setup: "PrescribedSurface"
prognostic_surface: "PrescribedSST"
t_end: "2days"
start_date: "20010101"            # polar winter
checkpoint_dt: "90days"           # > t_end: no checkpoints during smoke test
